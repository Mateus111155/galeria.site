<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - PhotoStudio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-login">

    <div class="caixa-login">

        <h1>📸 PhotoStudio</h1>

        <h2>Criar sua conta</h2>

        <p>Cadastre-se para começar.</p>

        <form id="formCadastro">

            <label>Nome</label>
            <input
                type="text"
                id="nome"
                placeholder="Seu nome"
                required
            >

            <label>E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
            >

            <label>Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <p id="mensagem"></p>

        <a href="/login.html">
            Já tenho uma conta
        </a>

    </div>

    <script src="../js/cadastro.js"></script>

</body>
</html>
