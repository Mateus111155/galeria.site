<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel - PhotoStudio</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="logo">
            📸 PhotoStudio
        </div>

        <nav>

            <span id="nomeUsuario">
                Carregando...
            </span>

            <button
                id="btnSair"
                type="button"
            >
                Sair
            </button>

        </nav>

    </header>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="painel">

        <div class="painel-topo">

            <div>

                <h1>
                    Painel do fotógrafo
                </h1>

                <p>
                    Gerencie seus clientes, galerias e seleções.
                </p>

            </div>


            <button
                class="botao-nova-galeria"
                type="button"
                onclick="window.location.href='/nova-galeria.html'"
            >
                + Nova galeria
            </button>

        </div>


        <!-- =================================================
             RESUMO
        ================================================== -->

        <section class="resumo-painel">

            <div class="resumo-card">

                <span class="resumo-icone">
                    📁
                </span>

                <div>

                    <strong id="totalGalerias">
                        0
                    </strong>

                    <p>
                        Galerias
                    </p>

                </div>

            </div>


            <div class="resumo-card">

                <span class="resumo-icone">
                    📷
                </span>

                <div>

                    <strong id="totalFotos">
                        0
                    </strong>

                    <p>
                        Fotos
                    </p>

                </div>

            </div>


            <div class="resumo-card">

                <span class="resumo-icone">
                    ❤️
                </span>

                <div>

                    <strong id="totalSelecionadas">
                        0
                    </strong>

                    <p>
                        Selecionadas
                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             GALERIAS
        ================================================== -->

        <section class="secao-galerias">

            <div class="secao-titulo">

                <div>

                    <h2>
                        Minhas galerias
                    </h2>

                    <p>
                        Veja as galerias criadas para seus clientes.
                    </p>

                </div>

            </div>


            <div
                id="mensagemPainel"
                class="mensagem-painel"
            >
            </div>


            <div
                id="listaGalerias"
                class="lista-galerias"
            >

                <div class="carregando-galerias">

                    Carregando galerias...

                </div>

            </div>

        </section>

    </main>


    <script src="/js/painel.js"></script>

</body>

</html>
