<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel - PhotoStudio</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>

        <div class="logo">
            📸 PhotoStudio
        </div>

        <nav>
            <span id="nomeUsuario"></span>

            <button id="btnSair">
                Sair
            </button>
        </nav>

    </header>

    <main class="painel">

        <h1>
            Painel do fotógrafo
        </h1>

        <p>
            Gerencie seus clientes, galerias e fotografias.
        </p>

        <div class="cards-painel">

            <div class="card-painel">

                <h2>👤 Clientes</h2>

                <p>
                    Cadastre e gerencie seus clientes.
                </p>

                <button>
                    Clientes
                </button>

            </div>

            <div class="card-painel">

                <h2>📁 Galerias</h2>

                <p>
                    Crie galerias para seus ensaios.
                </p>

                <button>
                    Criar galeria
                </button>

            </div>

            <div class="card-painel">

                <h2>📷 Fotos</h2>

                <p>
                    Envie fotos para seus clientes.
                </p>

                <button>
                    Enviar fotos
                </button>

            </div>

        </div>

    </main>

    <script src="/js/painel.js"></script>

</body>

</html>
